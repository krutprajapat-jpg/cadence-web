<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CADENCE</title>
  <style>
    :root {
      --bg: #0E0E10;
      --card: #18181B;
      --card-2: #222226;
      --border: #2C2C32;
      --text: #F4F4F5;
      --muted: #A1A1AA;
      --accent: #22C55E;
      --accent-text: #07130B;
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      padding: 16px 14px 48px 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .session-chip {
      font-size: 0.76rem;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }

    .nav-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 14px;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 9px 6px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .nav-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .daddy-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 10px;
    }

    .daddy-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.88rem;
      padding: 9px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .daddy-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .sub-toggle-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 12px;
    }

    .sub-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      padding-left: 2px;
    }

    .sub-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .sub-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 8px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .sub-btn.active {
      background: #E4E4E7;
      color: #09090B;
      border-color: #E4E4E7;
    }

    .outcome-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 10px;
    }

    .outcome-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-weight: 800;
      font-size: 0.88rem;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .outcome-btn.win.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .outcome-btn.loss.active {
      background: var(--danger);
      color: #FFFFFF;
      border-color: var(--danger);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .active-team-box {
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .team-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .team-name-heading {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      word-break: break-word;
    }

    .section-title {
      font-size: 0.92rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: var(--text);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 11px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 6px;
      transition: 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #FCA5A5;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      font-size: 0.82rem;
      width: auto;
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin: 10px 0 4px 2px;
    }

    input, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .choice-pill {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .choice-pill.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .row-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .row-item.clickable {
      cursor: pointer;
    }

    .row-item.clickable:hover {
      border-color: var(--accent);
    }

    .badge-win {
      color: var(--accent);
      font-weight: 800;
    }

    .badge-loss {
      color: var(--danger);
      font-weight: 800;
    }

    .muted {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .error {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #FCA5A5;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.84rem;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .success {
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #86EFAC;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.84rem;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .metric-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin: 8px 0;
    }

    .metric-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
      margin: 6px 0 10px 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 150px;
      padding: 12px 8px 4px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 36px;
      flex: 1;
      height: 100%;
      justify-content: flex-end;
    }

    .bar-num {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .bar-rect {
      width: 100%;
      max-width: 26px;
      background: var(--accent);
      border-radius: 6px 6px 0 0;
      min-height: 4px;
    }

    .bar-lbl {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    const SUPABASE_URL = "https://yaghdgrfuuehicfvukpu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ufLOPq7AQWVmpFiffO9HFw_Jh_iT3uj";

    const ROLES = ["Primary Rusher", "Secondary Rusher", "Sniper", "Supporter"];

    const state = {
      store: { players: {}, teams: {} },
      loggedPlayer: localStorage.getItem("cadence_logged_player") || null,
      draftName: "",
      teamInputName: "",
      joinCodeInput: "",
      pendingJoinTeam: null,
      authMode: "signin",
      forceLogin: false,
      tab: "Team",
      teamSubView: "home",
      selectedMember: null,
      playerSec: "Rank",
      rankMode: "Clash Squad",
      matchResult: "win",
      graphRange: "Date-wise",
      graphMetric: "Kills",
      authRole: ROLES[0],
      showAddPlayer: false,
      showChangePwd: false,
      message: null,
      error: null,
      loading: true
    };

    function defaultStats() {
      return {
        rank: { clash_squad: [], battle_royale: [] },
        training: { kd_ratio: 0.0, avg_kd: 0.0, logs: [] }
      };
    }

    function recomputeAvgKd(player) {
      player.stats = player.stats || defaultStats();
      player.stats.training = player.stats.training || { kd_ratio: 0.0, avg_kd: 0.0, logs: [] };
      const logs = player.stats.training.logs || [];
      if (!logs.length) {
        player.stats.training.avg_kd = Number(Number(player.stats.training.kd_ratio || 0).toFixed(2));
        return player.stats.training.avg_kd;
      }
      const sum = logs.reduce((acc, item) => acc + Number(item.kd || 0), 0);
      const avg = Number((sum / logs.length).toFixed(2));
      player.stats.training.avg_kd = avg;
      player.stats.training.kd_ratio = Number(Number(logs[logs.length - 1].kd ?? avg).toFixed(2));
      return avg;
    }

    function ensurePlayer(name, role = null, passwordHex = null, salt = null) {
      const clean = (name || "").trim();
      if (!clean) return null;
      state.store.players = state.store.players || {};
      if (!state.store.players[clean]) {
        const rec = {
          player_name: clean,
          role: ROLES.includes(role) ? role : ROLES[0],
          active_team: null,
          stats: defaultStats()
        };
        if (passwordHex && salt) {
          rec.auth = { salt, hash: passwordHex };
        }
        state.store.players[clean] = rec;
      } else {
        if (ROLES.includes(role)) {
          state.store.players[clean].role = role;
        }
        if (!Object.prototype.hasOwnProperty.call(state.store.players[clean], "active_team")) {
          state.store.players[clean].active_team = null;
        }
        if (passwordHex && salt && !state.store.players[clean].auth) {
          state.store.players[clean].auth = { salt, hash: passwordHex };
        }
      }
      recomputeAvgKd(state.store.players[clean]);
      return state.store.players[clean];
    }

    function generateTeamCode() {
      const existingCodes = new Set(
        Object.values(state.store.teams || {}).map(t => String(t.invite_code || ""))
      );
      let code = "";
      do {
        const num = Math.floor(1000 + Math.random() * 9000);
        code = `CAD-${num}`;
      } while (existingCodes.has(code));
      return code;
    }

    async function sha256Hex(text) {
      const enc = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function randomSalt() {
      const arr = new Uint8Array(8);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function makeAuth(password) {
      const salt = randomSalt();
      const hash = await sha256Hex(`${salt}:${password}`);
      return { salt, hash };
    }

    async function checkAuth(password, authObj) {
      if (!authObj || !authObj.salt || !authObj.hash) return false;
      const testHash = await sha256Hex(`${authObj.salt}:${password}`);
      return testHash === authObj.hash;
    }

    async function loadFromSupabase() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/cadence_store?id=eq.main&select=data`, {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      if (!res.ok) {
        throw new Error(`Supabase read failed (${res.status})`);
      }
      const rows = await res.json();
      let data = rows.length ? rows[0].data : null;
      if (!data) {
        data = { players: {}, teams: {} };
        await saveToSupabase(data);
      }
      data.players = data.players || {};
      data.teams = data.teams || {};
      delete data.active_team;
      Object.values(data.players).forEach(p => {
        recomputeAvgKd(p);
        if (p.active_team) {
          const tObj = data.teams[p.active_team];
          const isMember = tObj && Array.isArray(tObj.members) && tObj.members.includes(p.player_name);
          if (!isMember) {
            p.active_team = null;
          }
        }
      });
      return data;
    }

    async function saveToSupabase(data) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/cadence_store`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "resolution=merge-duplicates"
        },
        body: JSON.stringify([{ id: "main", data }])
      });
      if (!res.ok) {
        throw new Error(`Supabase save failed (${res.status})`);
      }
    }

    async function syncStoreNow(successMsg = null) {
      try {
        await saveToSupabase(state.store);
        if (successMsg) {
          setFeedback({ message: successMsg });
          render();
        }
      } catch (err) {
        setFeedback({ error: `Cloud sync issue: ${err.message}` });
        render();
      }
    }

    function playerSummary(player) {
      const st = player.stats || defaultStats();
      const cs = (st.rank?.clash_squad || []).reduce((s, x) => s + Number(x.kills || 0), 0);
      const br = (st.rank?.battle_royale || []).reduce((s, x) => s + Number(x.kills || 0), 0);
      const avgKd = recomputeAvgKd(player);
      return {
        kills: cs + br,
        avgKd,
        composite: Number((cs + br + avgKd * 10).toFixed(1))
      };
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setFeedback({ error = null, message = null }) {
      state.error = error;
      state.message = message;
    }

    function getActiveTeamForPlayer(player) {
      if (!player) return null;
      const teams = state.store.teams || {};
      const tName = player.active_team;
      if (!tName || !Object.prototype.hasOwnProperty.call(teams, tName)) return null;
      const teamObj = teams[tName];
      if (!Array.isArray(teamObj.members) || !teamObj.members.includes(player.player_name)) {
        return null;
      }
      return teamObj;
    }

    function render() {
      const root = document.getElementById("app");
      if (state.loading) {
        root.innerHTML = `<div class="card"><p class="muted">Loading CADENCE...</p></div>`;
        return;
      }

      const loggedPlayer = state.loggedPlayer && state.store.players[state.loggedPlayer]
        ? state.store.players[state.loggedPlayer]
        : null;

      const activeTeam = getActiveTeamForPlayer(loggedPlayer);

      let html = `
        <div class="topbar">
          <div class="brand">
            <img src="CADENCEnobg.png" alt="CADENCE" onerror="this.style.display='none'" />
            <div class="brand-title">CADENCE</div>
          </div>
          ${loggedPlayer ? `<div class="session-chip">${escapeHtml(loggedPlayer.player_name)} • ${escapeHtml(activeTeam ? activeTeam.team_name : "No Team")}</div>` : ""}
        </div>
      `;

      if (state.error) {
        html += `<div class="error">${escapeHtml(state.error)}</div>`;
      }
      if (state.message) {
        html += `<div class="success">${escapeHtml(state.message)}</div>`;
      }

      if (!loggedPlayer || state.forceLogin) {
        html += `<div class="card">`;
        html += `<div class="daddy-toggle">
          <button type="button" class="daddy-btn ${state.authMode === "signin" ? "active" : ""}" data-auth-mode="signin">Sign In</button>
          <button type="button" class="daddy-btn ${state.authMode === "signup" ? "active" : ""}" data-auth-mode="signup">Sign Up</button>
        </div>`;

        html += `<label>Player Name</label><input id="loginName" type="text" autocomplete="off" value="${escapeHtml(state.draftName)}" placeholder="Enter player name" />`;

        if (state.authMode === "signin") {
          html += `<label>Password</label><input id="loginPwd" type="password" autocomplete="current-password" placeholder="Enter your password" />`;
          html += `<button type="button" class="btn btn-primary" id="btnLogin">Sign In</button>`;
        } else {
          html += `<label>Select Role</label><div class="pill-group">`;
          ROLES.forEach(r => {
            const active = state.authRole === r ? "active" : "";
            html += `<button type="button" class="choice-pill ${active}" data-auth-role="${escapeHtml(r)}">${escapeHtml(r)}</button>`;
          });
          html += `</div>`;
          html += `<label>Create Password</label><input id="regPwd1" type="password" autocomplete="new-password" placeholder="At least 4 characters" />`;
          html += `<label>Confirm Password</label><input id="regPwd2" type="password" autocomplete="new-password" placeholder="Re-enter password" />`;
          html += `<button type="button" class="btn btn-primary" id="btnRegister">Sign Up & Enter App</button>`;
        }

        if (loggedPlayer) {
          html += `<button type="button" class="btn" id="btnCancelLogin">Cancel</button>`;
        }
        html += `</div>`;
        root.innerHTML = html;
        bindEvents();
        return;
      }

      html += `<div class="nav-pills">`;
      ["Team", "Graphs", "Menu"].forEach(t => {
        html += `<button type="button" class="nav-btn ${state.tab === t ? "active" : ""}" data-tab="${t}">${t}</button>`;
      });
      html += `</div>`;

      if (state.tab === "Team") {
        if (state.teamSubView === "player" && state.selectedMember && activeTeam) {
          const target = ensurePlayer(state.selectedMember);
          const canEdit = target.player_name === loggedPlayer.player_name;

          html += `<div style="margin-bottom:10px;"><button type="button" class="btn btn-ghost" id="backToSquad">← Back to Squad</button></div>`;
          html += `<div class="card">`;
          html += `<div class="section-title">${escapeHtml(target.player_name)} <span class="muted">(${escapeHtml(target.role)} • ${canEdit ? "Editable" : "View Only"})</span></div>`;

          html += `<div class="daddy-toggle">`;
          ["Rank", "Training"].forEach(sec => {
            html += `<button type="button" class="daddy-btn ${state.playerSec === sec ? "active" : ""}" data-sec="${sec}">${sec}</button>`;
          });
          html += `</div>`;

          if (state.playerSec === "Rank") {
            html += `<div class="sub-toggle-wrap">
              <div class="sub-label">Rank Mode</div>
              <div class="sub-toggle">`;
            ["Clash Squad", "Battle Royale"].forEach(m => {
              html += `<button type="button" class="sub-btn ${state.rankMode === m ? "active" : ""}" data-rmode="${m}">${m}</button>`;
            });
            html += `</div></div>`;

            const key = state.rankMode === "Clash Squad" ? "clash_squad" : "battle_royale";
            target.stats.rank[key] = target.stats.rank[key] || [];
            const entries = target.stats.rank[key];
            const totalKills = entries.reduce((s, x) => s + Number(x.kills || 0), 0);
            const pct = Math.min(100, Math.round((totalKills / Math.max(25, totalKills)) * 100));

            html += `<div class="muted">Total Kills (${escapeHtml(state.rankMode)}): ${totalKills}</div>`;
            html += `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;

            if (canEdit) {
              const today = new Date().toISOString().slice(0, 10);
              html += `<label>Date</label><input id="rankDate" type="date" value="${today}" />`;
              html += `<label>Kills</label><input id="rankKills" type="number" min="0" value="0" />`;
              html += `<label>Result</label><div class="outcome-grid">
                <button type="button" class="outcome-btn win ${state.matchResult === "win" ? "active" : ""}" data-outcome="win">WIN</button>
                <button type="button" class="outcome-btn loss ${state.matchResult === "loss" ? "active" : ""}" data-outcome="loss">LOSS</button>
              </div>`;
              html += `<button type="button" class="btn btn-primary" id="saveRankMatch">Save Match</button>`;
            }

            entries.slice(-8).reverse().forEach(item => {
              const badgeClass = item.won ? "badge-win" : "badge-loss";
              html += `<div class="row-item"><span>${escapeHtml(item.date)} • Kills: ${item.kills}</span><span class="${badgeClass}">${item.won ? "WIN" : "LOSS"}</span></div>`;
            });
          } else {
            const avgKd = recomputeAvgKd(target);
            target.stats.training.logs = target.stats.training.logs || [];
            const logs = target.stats.training.logs;

            html += `<div class="metric-box"><div class="muted">Average K/D Ratio</div><div class="metric-val">${avgKd.toFixed(2)}</div></div>`;

            if (canEdit) {
              const today = new Date().toISOString().slice(0, 10);
              html += `<label>Date</label><input id="trDate" type="date" value="${today}" />`;
              html += `<label>Game K/D Ratio</label><input id="trKd" type="number" min="0" step="0.01" value="0.00" />`;
              html += `<label>Kills</label><input id="trKills" type="number" min="0" value="0" />`;
              html += `<button type="button" class="btn btn-primary" id="saveTraining">Save Training Game</button>`;
            }

            logs.slice(-8).reverse().forEach(item => {
              html += `<div class="row-item"><span>${escapeHtml(item.date)} • K/D: ${Number(item.kd || 0).toFixed(2)}</span><span>Kills: ${item.kills || 0}</span></div>`;
            });
          }

          html += `</div>`;
        } else if (state.teamSubView === "squad" && activeTeam) {
          html += `<div style="margin-bottom:10px;"><button type="button" class="btn btn-ghost" id="backToTeam">← Back to Team</button></div>`;
          html += `<div class="card">`;
          html += `<div class="team-tag">Active Squad</div>`;
          html += `<div class="team-name-heading">${escapeHtml(activeTeam.team_name)}</div>`;
          html += `<div class="row-item"><span>Team Code</span><strong>${escapeHtml(activeTeam.invite_code)}</strong></div>`;
          html += `<div class="section-title" style="margin-top:12px;">Squad Players</div>`;

          (activeTeam.members || []).forEach(m => {
            ensurePlayer(m);
            html += `<div class="row-item clickable" data-open-member="${escapeHtml(m)}"><strong>${escapeHtml(m)}</strong><span class="muted">Open →</span></div>`;
          });

          html += `<button type="button" class="btn" id="toggleAddPlayer">${state.showAddPlayer ? "Hide Add Player" : "+ Add Player"}</button>`;
          if (state.showAddPlayer) {
            html += `<label>Player Name</label><input id="newMemberName" type="text" autocomplete="off" placeholder="Enter player name" />`;
            html += `<label>Role</label><select id="newMemberRole">${ROLES.map(r => `<option value="${r}">${r}</option>`).join("")}</select>`;
            html += `<label>Password (if new player)</label><input id="newMemberPwd" type="password" autocomplete="new-password" placeholder="Optional if existing" />`;
            html += `<button type="button" class="btn btn-primary" id="confirmAddPlayer">Add to Squad</button>`;
          }

          html += `<button type="button" class="btn btn-danger" id="leaveTeamBtn" style="margin-top:12px;">Leave Team</button>`;
          html += `</div>`;
        } else {
          const joinedTeams = Object.keys(state.store.teams || {}).filter(tName =>
            Array.isArray(state.store.teams[tName].members) &&
            state.store.teams[tName].members.includes(loggedPlayer.player_name)
          );

          html += `<div class="card">`;

          if (activeTeam) {
            html += `<div class="active-team-box">
              <div class="team-tag">Your Current Team</div>
              <div class="team-name-heading">${escapeHtml(activeTeam.team_name)}</div>
              <button type="button" class="btn btn-primary" id="openSquadBanner">Open Squad & Team Code</button>
              <button type="button" class="btn btn-danger" id="leaveTeamBtn">Leave Team</button>
            </div>`;
          } else {
            html += `<div class="muted" style="margin-bottom:8px;">You are not in any team yet. Create a new team or join an existing one below.</div>`;
          }

          if (joinedTeams.length > 1) {
            html += `<label>Switch Your Joined Teams</label><select id="switchTeamSelect">`;
            joinedTeams.forEach(t => {
              html += `<option value="${escapeHtml(t)}" ${activeTeam && activeTeam.team_name === t ? "selected" : ""}>${escapeHtml(t)}</option>`;
            });
            html += `</select>`;
          }

          html += `<label>Team Name (Exact Space & Case Sensitive)</label>`;
          html += `<input id="teamNameInput" type="text" autocomplete="off" value="${escapeHtml(state.teamInputName)}" placeholder="Enter team name" />`;
          html += `<button type="button" class="btn btn-primary" id="submitTeamNameBtn">Continue</button>`;

          if (state.pendingJoinTeam && Object.prototype.hasOwnProperty.call(state.store.teams || {}, state.pendingJoinTeam)) {
            html += `<div class="error" style="margin-top:12px;">Team "${escapeHtml(state.pendingJoinTeam)}" already exists. Enter its Team Code to join:</div>`;
            html += `<label>Team Code</label>`;
            html += `<input id="joinCodeInput" type="text" autocomplete="off" value="${escapeHtml(state.joinCodeInput)}" placeholder="Enter team code" />`;
            html += `<button type="button" class="btn btn-primary" id="verifyJoinCodeBtn">Join Team</button>`;
          }
          html += `</div>`;
        }
      }

      if (state.tab === "Graphs") {
        const members = activeTeam && (activeTeam.members || []).length
          ? activeTeam.members
          : [loggedPlayer.player_name];

        html += `<div class="card"><div class="section-title">Team Player Rank</div>`;
        const ranked = members.map(m => ({ name: m, info: playerSummary(ensurePlayer(m)) }))
          .sort((a, b) => b.info.composite - a.info.composite);

        if (!ranked.length) {
          html += `<div class="muted">No players yet.</div>`;
        } else {
          ranked.forEach((item, i) => {
            html += `<div class="row-item"><span><strong>#${i + 1} ${escapeHtml(item.name)}</strong></span><span class="muted">Kills: ${item.info.kills} • Avg K/D: ${item.info.avgKd.toFixed(2)}</span></div>`;
          });
        }
        html += `</div>`;

        html += `<div class="card"><div class="section-title">Performance Graph</div>`;
        html += `<div class="pill-group">`;
        ["Date-wise", "Last 30 Days", "Last 90 Days"].forEach(rng => {
          html += `<button type="button" class="choice-pill ${state.graphRange === rng ? "active" : ""}" data-grange="${rng}">${rng}</button>`;
        });
        html += `</div>`;

        html += `<div class="pill-group">`;
        ["Kills", "Avg K/D", "Games Played"].forEach(m => {
          html += `<button type="button" class="choice-pill ${state.graphMetric === m ? "active" : ""}" data-gmetric="${m}">${m}</button>`;
        });
        html += `</div>`;

        let cutoff = null;
        if (state.graphRange === "Last 30 Days") {
          cutoff = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
        } else if (state.graphRange === "Last 90 Days") {
          cutoff = new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10);
        }

        const inRange = (d) => !cutoff || !d || d >= cutoff;
        const rankGames = [];
        const trLogs = [];

        members.forEach(m => {
          const s = ensurePlayer(m).stats || defaultStats();
          (s.rank?.clash_squad || []).concat(s.rank?.battle_royale || []).forEach(g => {
            if (inRange(g.date)) rankGames.push(g);
          });
          (s.training?.logs || []).forEach(t => {
            if (inRange(t.date)) trLogs.push(t);
          });
        });

        const wins = rankGames.filter(g => g.won).length;
        const losses = rankGames.length - wins;
        const winPct = rankGames.length ? Math.round((wins / rankGames.length) * 100) : 0;

        html += `<div class="muted" style="margin-bottom:8px;">Games: ${rankGames.length + trLogs.length} | W/L: ${wins}W-${losses}L (${winPct}%)</div>`;

        const seriesMap = {};
        if (state.graphMetric === "Kills") {
          rankGames.forEach(g => {
            const k = g.date || "N/A";
            seriesMap[k] = (seriesMap[k] || 0) + Number(g.kills || 0);
          });
        } else if (state.graphMetric === "Avg K/D") {
          const buckets = {};
          trLogs.forEach(t => {
            const k = t.date || "N/A";
            buckets[k] = buckets[k] || [];
            buckets[k].push(Number(t.kd || 0));
          });
          Object.keys(buckets).forEach(k => {
            seriesMap[k] = Number((buckets[k].reduce((a, b) => a + b, 0) / buckets[k].length).toFixed(2));
          });
        } else {
          rankGames.concat(trLogs).forEach(item => {
            const k = item.date || "N/A";
            seriesMap[k] = (seriesMap[k] || 0) + 1;
          });
        }

        const entries = Object.entries(seriesMap).sort((a, b) => a[0].localeCompare(b[0]));
        if (!entries.length) {
          html += `<div class="muted">No records for this filter yet.</div>`;
        } else {
          const maxVal = Math.max(...entries.map(e => e[1]), 1);
          html += `<div class="bars">`;
          entries.forEach(([label, val]) => {
            const hPct = Math.max(6, Math.round((val / maxVal) * 100));
            html += `
              <div class="bar-col">
                <div class="bar-num">${val}</div>
                <div class="bar-rect" style="height:${hPct}%"></div>
                <div class="bar-lbl">${escapeHtml(label.slice(5))}</div>
              </div>
            `;
          });
          html += `</div>`;
        }
        html += `</div>`;
      }

      if (state.tab === "Menu") {
        html += `<div class="card">`;
        html += `<div class="row-item"><span>Player</span><strong>${escapeHtml(loggedPlayer.player_name)}</strong></div>`;
        html += `<div class="row-item"><span>Role</span><strong>${escapeHtml(loggedPlayer.role)}</strong></div>`;
        html += `<div class="row-item"><span>Team</span><strong>${escapeHtml(activeTeam ? activeTeam.team_name : "None")}</strong></div>`;

        html += `<button type="button" class="btn" id="switchPlayerBtn">Switch Player</button>`;
        html += `<button type="button" class="btn" id="toggleChangePwd">${state.showChangePwd ? "Hide Change Password" : "Change Password"}</button>`;

        if (state.showChangePwd) {
          html += `<label>Current Password</label><input id="oldPwdInput" type="password" autocomplete="current-password" />`;
          html += `<label>New Password</label><input id="newPwdInput" type="password" autocomplete="new-password" placeholder="At least 4 characters" />`;
          html += `<button type="button" class="btn btn-primary" id="updatePwdBtn">Update Password</button>`;
        }

        if (Object.prototype.hasOwnProperty.call(state.store.teams || {}, "THE EMPIRE")) {
          html += `<button type="button" class="btn btn-danger" id="purgeDefaultEmpireBtn" style="margin-top:12px;">Delete Legacy "THE EMPIRE" Team</button>`;
        }
        html += `</div>`;
      }

      root.innerHTML = html;
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll("[data-auth-mode]").forEach(btn => {
        btn.onclick = () => {
          const curName = document.getElementById("loginName");
          if (curName) state.draftName = curName.value;
          state.authMode = btn.dataset.authMode;
          setFeedback({});
          render();
        };
      });

      const loginNameInput = document.getElementById("loginName");
      if (loginNameInput) {
        loginNameInput.addEventListener("input", (e) => {
          state.draftName = e.target.value;
        });
        loginNameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            state.draftName = e.target.value;
            const pwdEl = document.getElementById("loginPwd") || document.getElementById("regPwd1");
            if (pwdEl) pwdEl.focus();
          }
        });
      }

      document.querySelectorAll("[data-auth-role]").forEach(btn => {
        btn.onclick = () => {
          const curName = document.getElementById("loginName");
          if (curName) state.draftName = curName.value;
          state.authRole = btn.dataset.authRole;
          render();
        };
      });

      const btnLogin = document.getElementById("btnLogin");
      if (btnLogin) {
        btnLogin.onclick = async () => {
          setFeedback({});
          const name = ((document.getElementById("loginName")?.value ?? state.draftName) || "").trim();
          const pwd = document.getElementById("loginPwd")?.value || "";
          state.draftName = name;
          if (!name) {
            setFeedback({ error: "Enter a player name first." });
            render();
            return;
          }
          const player = state.store.players[name];
          if (!player || !(await checkAuth(pwd, player.auth))) {
            setFeedback({ error: "Wrong password or player not found." });
            render();
            return;
          }
          state.loggedPlayer = player.player_name;
          state.draftName = "";
          localStorage.setItem("cadence_logged_player", player.player_name);
          state.forceLogin = false;
          render();
        };
      }

      const btnRegister = document.getElementById("btnRegister");
      if (btnRegister) {
        btnRegister.onclick = async () => {
          setFeedback({});
          const name = ((document.getElementById("loginName")?.value ?? state.draftName) || "").trim();
          const p1 = document.getElementById("regPwd1")?.value || "";
          const p2 = document.getElementById("regPwd2")?.value || "";
          state.draftName = name;
          if (!name) {
            setFeedback({ error: "Enter a player name first." });
            render();
            return;
          }
          if (state.store.players[name]?.auth) {
            setFeedback({ error: "Player already exists. Switch to Sign In." });
            render();
            return;
          }
          if (p1.length < 4) {
            setFeedback({ error: "Password must be at least 4 characters." });
            render();
            return;
          }
          if (p1 !== p2) {
            setFeedback({ error: "Passwords do not match." });
            render();
            return;
          }
          const auth = await makeAuth(p1);
          const rec = ensurePlayer(name, state.authRole, auth.hash, auth.salt);
          rec.active_team = null;
          state.loggedPlayer = rec.player_name;
          state.draftName = "";
          localStorage.setItem("cadence_logged_player", rec.player_name);
          state.forceLogin = false;
          setFeedback({ message: "Account created & signed in!" });
          render();
          await syncStoreNow("Account created & signed in!");
        };
      }

      const btnCancelLogin = document.getElementById("btnCancelLogin");
      if (btnCancelLogin) {
        btnCancelLogin.onclick = () => {
          state.forceLogin = false;
          state.draftName = "";
          setFeedback({});
          render();
        };
      }

      document.querySelectorAll("[data-tab]").forEach(btn => {
        btn.onclick = () => {
          state.tab = btn.dataset.tab;
          state.teamSubView = "home";
          state.selectedMember = null;
          setFeedback({});
          render();
        };
      });

      const openSquadBanner = document.getElementById("openSquadBanner");
      if (openSquadBanner) {
        openSquadBanner.onclick = () => {
          setFeedback({});
          state.teamSubView = "squad";
          render();
        };
      }

      const leaveTeamBtn = document.getElementById("leaveTeamBtn");
      if (leaveTeamBtn) {
        leaveTeamBtn.onclick = async () => {
          setFeedback({});
          const me = ensurePlayer(state.loggedPlayer);
          const team = getActiveTeamForPlayer(me);
          if (!me || !team) return;

          const leftTeamName = team.team_name;
          team.members = (team.members || []).filter(m => m !== me.player_name);
          me.active_team = null;

          if (team.members.length === 0) {
            delete state.store.teams[leftTeamName];
          }

          state.teamSubView = "home";
          state.selectedMember = null;
          setFeedback({ message: `You left "${leftTeamName}".` });
          render();
          await syncStoreNow(`You left "${leftTeamName}".`);
        };
      }

      const switchTeamSelect = document.getElementById("switchTeamSelect");
      if (switchTeamSelect) {
        switchTeamSelect.onchange = async () => {
          const me = ensurePlayer(state.loggedPlayer);
          if (me) {
            me.active_team = switchTeamSelect.value;
          }
          state.pendingJoinTeam = null;
          state.joinCodeInput = "";
          render();
          await syncStoreNow();
        };
      }

      const teamNameInput = document.getElementById("teamNameInput");
      if (teamNameInput) {
        teamNameInput.addEventListener("input", (e) => {
          state.teamInputName = e.target.value;
          if (state.pendingJoinTeam && e.target.value.trim() !== state.pendingJoinTeam) {
            state.pendingJoinTeam = null;
            state.joinCodeInput = "";
          }
        });
      }

      const joinCodeInput = document.getElementById("joinCodeInput");
      if (joinCodeInput) {
        joinCodeInput.addEventListener("input", (e) => {
          state.joinCodeInput = e.target.value;
        });
      }

      const submitTeamNameBtn = document.getElementById("submitTeamNameBtn");
      if (submitTeamNameBtn) {
        submitTeamNameBtn.onclick = async () => {
          setFeedback({});
          const me = ensurePlayer(state.loggedPlayer);
          if (!me) return;

          const rawName = (document.getElementById("teamNameInput")?.value ?? state.teamInputName) || "";
          const exactName = rawName.trim();
          state.teamInputName = exactName;

          if (!exactName) {
            state.pendingJoinTeam = null;
            setFeedback({ error: "Please enter a team name." });
            render();
            return;
          }

          const hasExactMatch = Object.prototype.hasOwnProperty.call(state.store.teams || {}, exactName);

          if (hasExactMatch) {
            const existingTeam = state.store.teams[exactName];
            existingTeam.members = existingTeam.members || [];
            if (existingTeam.members.includes(me.player_name)) {
              me.active_team = exactName;
              state.pendingJoinTeam = null;
              state.joinCodeInput = "";
              state.teamInputName = "";
              setFeedback({ message: `Switched to "${exactName}".` });
              render();
              await syncStoreNow(`Switched to "${exactName}".`);
              return;
            }
            state.pendingJoinTeam = exactName;
            state.joinCodeInput = "";
            render();
            return;
          }

          state.pendingJoinTeam = null;
          state.joinCodeInput = "";
          state.teamInputName = "";
          const newCode = generateTeamCode();
          state.store.teams[exactName] = {
            team_name: exactName,
            creator: me.player_name,
            invite_code: newCode,
            members: [me.player_name],
            invites_sent: []
          };
          me.active_team = exactName;
          setFeedback({ message: `New team "${exactName}" created! Team Code: ${newCode}` });
          render();
          await syncStoreNow(`New team "${exactName}" created! Team Code: ${newCode}`);
        };
      }

      const verifyJoinCodeBtn = document.getElementById("verifyJoinCodeBtn");
      if (verifyJoinCodeBtn) {
        verifyJoinCodeBtn.onclick = async () => {
          setFeedback({});
          const me = ensurePlayer(state.loggedPlayer);
          if (!me) return;

          const targetName = state.pendingJoinTeam;
          const enteredCode = ((document.getElementById("joinCodeInput")?.value ?? state.joinCodeInput) || "").trim();
          const teamObj = targetName && Object.prototype.hasOwnProperty.call(state.store.teams || {}, targetName)
            ? state.store.teams[targetName]
            : null;

          if (!teamObj) {
            state.pendingJoinTeam = null;
            setFeedback({ error: "Team not found." });
            render();
            return;
          }

          if (enteredCode !== String(teamObj.invite_code || "")) {
            setFeedback({ error: "Wrong team code." });
            render();
            return;
          }

          teamObj.members = teamObj.members || [];
          if (!teamObj.members.includes(me.player_name)) {
            teamObj.members.push(me.player_name);
          }
          me.active_team = targetName;
          state.pendingJoinTeam = null;
          state.joinCodeInput = "";
          state.teamInputName = "";
          setFeedback({ message: `Joined "${targetName}"!` });
          render();
          await syncStoreNow(`Joined "${targetName}"!`);
        };
      }

      const backToTeam = document.getElementById("backToTeam");
      if (backToTeam) {
        backToTeam.onclick = () => {
          state.teamSubView = "home";
          state.selectedMember = null;
          render();
        };
      }

      document.querySelectorAll("[data-open-member]").forEach(el => {
        el.onclick = () => {
          state.selectedMember = el.dataset.openMember;
          state.teamSubView = "player";
          setFeedback({});
          render();
        };
      });

      const toggleAddPlayer = document.getElementById("toggleAddPlayer");
      if (toggleAddPlayer) {
        toggleAddPlayer.onclick = () => {
          state.showAddPlayer = !state.showAddPlayer;
          render();
        };
      }

      const confirmAddPlayer = document.getElementById("confirmAddPlayer");
      if (confirmAddPlayer) {
        confirmAddPlayer.onclick = async () => {
          setFeedback({});
          const mName = (document.getElementById("newMemberName")?.value || "").trim();
          const mRole = document.getElementById("newMemberRole")?.value || ROLES[0];
          const mPwd = document.getElementById("newMemberPwd")?.value || "";
          const team = getActiveTeamForPlayer(loggedPlayer);
          if (!mName || !team) return;

          let auth = null;
          if (!state.store.players[mName] && mPwd.length >= 4) {
            auth = await makeAuth(mPwd);
          }
          const added = ensurePlayer(mName, mRole, auth?.hash || null, auth?.salt || null);
          if (added && !added.active_team) {
            added.active_team = team.team_name;
          }
          team.members = team.members || [];
          if (!team.members.includes(mName)) {
            team.members.push(mName);
          }
          state.showAddPlayer = false;
          setFeedback({ message: `${mName} added.` });
          render();
          await syncStoreNow(`${mName} added.`);
        };
      }

      const backToSquad = document.getElementById("backToSquad");
      if (backToSquad) {
        backToSquad.onclick = () => {
          state.selectedMember = null;
          state.teamSubView = "squad";
          render();
        };
      }

      document.querySelectorAll("[data-sec]").forEach(btn => {
        btn.onclick = () => {
          state.playerSec = btn.dataset.sec;
          setFeedback({});
          render();
        };
      });

      document.querySelectorAll("[data-rmode]").forEach(btn => {
        btn.onclick = () => {
          state.rankMode = btn.dataset.rmode;
          setFeedback({});
          render();
        };
      });

      document.querySelectorAll("[data-outcome]").forEach(btn => {
        btn.onclick = () => {
          state.matchResult = btn.dataset.outcome;
          render();
        };
      });

      const saveRankMatch = document.getElementById("saveRankMatch");
      if (saveRankMatch) {
        saveRankMatch.onclick = async () => {
          setFeedback({});
          const target = ensurePlayer(state.selectedMember);
          const key = state.rankMode === "Clash Squad" ? "clash_squad" : "battle_royale";
          const dateVal = document.getElementById("rankDate")?.value || new Date().toISOString().slice(0, 10);
          const killsVal = Math.max(0, parseInt(document.getElementById("rankKills")?.value || "0", 10));
          const wonVal = state.matchResult === "win";
          target.stats.rank[key] = target.stats.rank[key] || [];
          target.stats.rank[key].push({ date: dateVal, kills: killsVal, won: wonVal });
          setFeedback({ message: `Match saved (${wonVal ? "WIN" : "LOSS"}).` });
          render();
          await syncStoreNow(`Match saved (${wonVal ? "WIN" : "LOSS"}).`);
        };
      }

      const saveTraining = document.getElementById("saveTraining");
      if (saveTraining) {
        saveTraining.onclick = async () => {
          setFeedback({});
          const target = ensurePlayer(state.selectedMember);
          const dateVal = document.getElementById("trDate")?.value || new Date().toISOString().slice(0, 10);
          const kdVal = Math.max(0, Number(parseFloat(document.getElementById("trKd")?.value || "0").toFixed(2)));
          const killsVal = Math.max(0, parseInt(document.getElementById("trKills")?.value || "0", 10));
          target.stats.training.logs = target.stats.training.logs || [];
          target.stats.training.logs.push({ date: dateVal, kd: kdVal, kills: killsVal });
          recomputeAvgKd(target);
          setFeedback({ message: "Training game saved." });
          render();
          await syncStoreNow("Training game saved.");
        };
      }

      document.querySelectorAll("[data-grange]").forEach(btn => {
        btn.onclick = () => {
          state.graphRange = btn.dataset.grange;
          render();
        };
      });

      document.querySelectorAll("[data-gmetric]").forEach(btn => {
        btn.onclick = () => {
          state.graphMetric = btn.dataset.gmetric;
          render();
        };
      });

      const switchPlayerBtn = document.getElementById("switchPlayerBtn");
      if (switchPlayerBtn) {
        switchPlayerBtn.onclick = () => {
          state.forceLogin = true;
          state.authMode = "signin";
          state.draftName = "";
          setFeedback({});
          render();
        };
      }

      const toggleChangePwd = document.getElementById("toggleChangePwd");
      if (toggleChangePwd) {
        toggleChangePwd.onclick = () => {
          state.showChangePwd = !state.showChangePwd;
          render();
        };
      }

      const updatePwdBtn = document.getElementById("updatePwdBtn");
      if (updatePwdBtn) {
        updatePwdBtn.onclick = async () => {
          setFeedback({});
          const oldPwd = document.getElementById("oldPwdInput")?.value || "";
          const newPwd = document.getElementById("newPwdInput")?.value || "";
          const player = state.store.players[state.loggedPlayer];
          if (!(await checkAuth(oldPwd, player.auth))) {
            setFeedback({ error: "Current password is incorrect." });
            render();
            return;
          }
          if (newPwd.length < 4) {
            setFeedback({ error: "New password must be at least 4 characters." });
            render();
            return;
          }
          player.auth = await makeAuth(newPwd);
          state.showChangePwd = false;
          setFeedback({ message: "Password updated." });
          render();
          await syncStoreNow("Password updated.");
        };
      }

      const purgeDefaultEmpireBtn = document.getElementById("purgeDefaultEmpireBtn");
      if (purgeDefaultEmpireBtn) {
        purgeDefaultEmpireBtn.onclick = async () => {
          setFeedback({});
          delete state.store.teams["THE EMPIRE"];
          Object.values(state.store.players || {}).forEach(p => {
            if (p.active_team === "THE EMPIRE") {
              p.active_team = null;
            }
          });
          setFeedback({ message: 'Removed legacy "THE EMPIRE" team from store.' });
          render();
          await syncStoreNow('Removed legacy "THE EMPIRE" team from store.');
        };
      }
    }

    (async function init() {
      try {
        state.store = await loadFromSupabase();
      } catch (err) {
        state.error = `Could not load from Supabase: ${err.message}`;
      } finally {
        state.loading = false;
        render();
      }
    })();
  </script>
</body>
</html>
